name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Tests (hooks, compression, vault, themes)
        run: node test.js
        env:
          SHELL: /bin/bash

      - name: Themes
        run: node bin/theme-check.js themes/*.json

      - name: Plugin and marketplace manifests
        run: bash bin/check-plugin.sh
