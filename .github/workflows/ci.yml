name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Python engine of the output compression (vendor/token-saver needs >= 3.10).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Tests (hooks, compression, vault, themes)
        run: node test.js
        env:
          SHELL: /bin/bash
          CCX_TEST_REQUIRE_PYTHON: '1'
          # python.js never searches PATH: point it at the setup-python interpreter.
          CCX_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Themes
        run: node bin/theme-check.js themes/*.json

      - name: Plugin and marketplace manifests
        run: bash bin/check-plugin.sh
